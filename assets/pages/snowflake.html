<section class="doc-section"><h1 data-page-title>Snowflake</h1><p>Configure a <a href="#/snowflake-connection">Snowflake project connection</a>, then use the <a href="#/snowflake-connector">Snowflake workflow connector</a> to execute SQL. The connection guide covers Security Credentials, Keystore key pairs, and JDBC properties; the connector guide covers pipeline mapping and runtime behavior.</p></section>
