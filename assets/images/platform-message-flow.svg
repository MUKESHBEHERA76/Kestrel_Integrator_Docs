<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">Kestrel platform message flow</title>
<desc id="desc">Webhook, scheduler, and event triggers create a durable run and outbox record in PostgreSQL. An outbox publisher confirms a command to RabbitMQ. An execution worker claims it, runs workflow steps and nested services, commits the result, then acknowledges delivery. The worker also sends a response to a waiting caller and logs to OpenSearch.</desc>
<defs>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#193149}.h{font-size:23px;font-weight:700}.s{font-size:16px}.label{font-size:15px;font-weight:700;fill:#38688a}.num{font-size:17px;font-weight:700;fill:#fff}.card{fill:#fff;stroke:#b8d0e1;stroke-width:2}.small{font-size:14px;fill:#536c7b}.flow{fill:none;stroke:#3c7ead;stroke-width:4;marker-end:url(#arrow)}.side{fill:none;stroke:#7f9bad;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#sideArrow)}</style>
 <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#3c7ead" stroke-width="2"/></marker>
 <marker id="sideArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#7f9bad" stroke-width="2"/></marker>
</defs>
<rect width="1440" height="790" rx="22" fill="#f5f9fc"/>
<text x="40" y="45" class="h">Example: process order ORD-1001</text><text x="40" y="72" class="s">One top-level run · durable command · bounded worker execution</text>
<!-- top-level nodes -->
<g transform="translate(40 120)"><rect class="card" width="235" height="164" rx="16"/><circle cx="36" cy="38" r="23" fill="#e3f2fc"/><path d="M26 38h20m-8-8 8 8-8 8" fill="none" stroke="#2875a4" stroke-width="3" stroke-linecap="round"/><text x="70" y="42" class="h">Triggers</text><text x="20" y="88" class="s">Webhook POST /orders</text><text x="20" y="116" class="s">Scheduler · email</text><text x="20" y="144" class="s">Salesforce · AMQP</text></g>
<g transform="translate(327 120)"><rect class="card" width="235" height="164" rx="16"/><circle cx="36" cy="38" r="23" fill="#e7f5ee"/><ellipse cx="36" cy="32" rx="12" ry="5" fill="none" stroke="#32835e" stroke-width="2"/><path d="M24 32v15c0 7 24 7 24 0V32" fill="none" stroke="#32835e" stroke-width="2"/><text x="70" y="42" class="h">PostgreSQL</text><text x="20" y="88" class="s">Atomic run + outbox</text><text x="20" y="116" class="s">Pinned workflow revision</text><text x="20" y="144" class="s">runId · commandId</text></g>
<g transform="translate(614 120)"><rect class="card" width="235" height="164" rx="16"/><circle cx="36" cy="38" r="23" fill="#eaf0fd"/><path d="M27 28h18M27 37h18M27 46h18" fill="none" stroke="#4967ab" stroke-width="3" stroke-linecap="round"/><text x="70" y="42" class="h">RabbitMQ</text><text x="20" y="88" class="s">Confirmed command</text><text x="20" y="116" class="s">Execution queue</text><text x="20" y="144" class="s">Buffers bursts</text></g>
<g transform="translate(901 120)"><rect class="card" width="235" height="164" rx="16"/><circle cx="36" cy="38" r="23" fill="#fdf1e4"/><rect x="27" y="29" width="18" height="18" rx="3" fill="none" stroke="#b9772e" stroke-width="2"/><path d="M23 36h4m18 0h4m-13-11v4m0 18v4" stroke="#b9772e" stroke-width="2"/><text x="70" y="42" class="h">Worker</text><text x="20" y="88" class="s">Claim + lease</text><text x="20" y="116" class="s">Workflow steps</text><text x="20" y="144" class="s">Bounded concurrency</text></g>
<g transform="translate(1188 120)"><rect class="card" width="212" height="164" rx="16"/><circle cx="36" cy="38" r="23" fill="#e7f5ee"/><path d="m27 38 6 6 13-14" fill="none" stroke="#32835e" stroke-width="3"/><text x="70" y="42" class="h">Outcome</text><text x="20" y="88" class="s">Commit run state</text><text x="20" y="116" class="s">Ack delivery</text><text x="20" y="144" class="s">Result by runId</text></g>
<path class="flow" d="M275 202H318"/><path class="flow" d="M562 202H605"/><path class="flow" d="M849 202H892"/><path class="flow" d="M1136 202H1179"/>
<text x="278" y="105" class="label">1 admit</text><text x="561" y="105" class="label">2 publish</text><text x="850" y="105" class="label">3 deliver</text><text x="1135" y="105" class="label">5 finish</text>
<!-- nested execution -->
<path class="side" d="M1018 284V355"/><rect x="844" y="368" width="350" height="106" rx="14" class="card"/><text x="866" y="400" class="h">4  Nested PriceService</text><text x="866" y="428" class="s">Map inputs → calculate total</text><text x="866" y="454" class="s">Map outputs back; same runId</text>
<!-- side flows -->
<path class="side" d="M954 474v100H174v-172"/><rect x="40" y="586" width="375" height="121" rx="14" class="card"/><text x="62" y="619" class="h">HTTP response, if caller waits</text><text x="62" y="649" class="s">Order total or accepted run ID</text><text x="62" y="679" class="small">Response window is bounded</text>
<path class="side" d="M1081 474v183h62"/><rect x="1156" y="586" width="244" height="121" rx="14" class="card"/><circle cx="1190" cy="620" r="18" fill="#eaf0fd"/><circle cx="1188" cy="617" r="8" fill="none" stroke="#4967ab" stroke-width="2"/><path d="m1194 623 7 7" stroke="#4967ab" stroke-width="2"/><text x="1218" y="625" class="h">OpenSearch</text><text x="1176" y="659" class="s">Masked async logs</text><text x="1176" y="685" class="small">Separate logging path</text>
<rect x="475" y="592" width="567" height="116" rx="14" fill="#eaf3f9"/><text x="497" y="624" class="h">Why the boundaries matter</text><text x="497" y="654" class="s">Outbox prevents lost accepted runs · queue absorbs bursts</text><text x="497" y="680" class="s">Worker limits protect dependencies · result survives retries</text>
</svg>
